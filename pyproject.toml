[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kurumi-research"
version = "0.1.0"
description = "Text incremental value in financial decision model post-training"
requires-python = ">=3.11,<3.13"
dependencies = ["duckdb>=1.3,<2", "pyarrow>=19,<24"]

[project.optional-dependencies]
quant = ["pandas>=2.2,<3", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "filelock>=3.18,<4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/kurumi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
